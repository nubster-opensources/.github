[package]
name = "ai-review"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Pull request review and description tooling for Nubster Open Source, powered by the Mistral API."

[[bin]]
name = "ai-review"
path = "src/main.rs"

[dependencies]
tokio   = { version = "1",    features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
octocrab   = { version = "0.47", default-features = false, features = ["default-client", "rustls", "rustls-ring", "timeout"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
base64    = "0.23"
sha2      = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all       = { level = "warn", priority = -1 }
pedantic  = { level = "warn", priority = -1 }
